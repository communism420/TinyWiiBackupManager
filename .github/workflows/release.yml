name: Release

on:
  push:
    branches:
      - main
      - dev
    tags:
      - "v*.*.*"
    paths:
      - ".github/workflows/release.yml"
      - "**.rs"
      - "Cargo.toml"
      - "Cargo.lock"
      - "package/**"
      - "scripts/**"
      - ".cargo/**"
      - "vendor/**"
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Create a draft release after checks (must equal v<Cargo version>)"
        required: false
        type: string
        default: ""

permissions:
  contents: read

env:
  VERSION_NAME: ${{ inputs.release_tag || (github.ref_type == 'tag' && github.ref_name || github.sha) }}

jobs:
  validate:
    name: Validate source (${{ matrix.os }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            runner: ubuntu-24.04
            features: dist-appimage
          - os: windows
            runner: windows-2022
            features: dist-windows-modern dist-windows-legacy
          - os: macos
            runner: macos-26
            features: dist-macos
    env:
      TWBM_DISABLE_UPDATES: 1
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.99
        with:
          components: clippy, rustfmt

      - name: Install NASM for Windows legacy tests
        if: matrix.os == 'windows'
        shell: pwsh
        run: ./scripts/install-nasm.ps1

      - name: Check version, formatting, tests and Clippy
        shell: bash
        env:
          RELEASE_REF_TYPE: ${{ github.ref_type }}
          RELEASE_REF_NAME: ${{ github.ref_name }}
          REQUESTED_RELEASE_TAG: ${{ inputs.release_tag }}
          CHECK_FEATURES: ${{ matrix.features }}
        run: |
          set -euo pipefail
          version="$(./scripts/current-version.sh)"
          if [ "$RELEASE_REF_TYPE" = tag ] && [ "$RELEASE_REF_NAME" != "v$version" ]; then
            echo "Release tag $RELEASE_REF_NAME does not match Cargo version $version" >&2
            exit 1
          fi
          if [ -n "$REQUESTED_RELEASE_TAG" ] && [ "$REQUESTED_RELEASE_TAG" != "v$version" ]; then
            echo "Requested release tag $REQUESTED_RELEASE_TAG does not match Cargo version $version" >&2
            exit 1
          fi
          cargo fmt --package TinyWiiBackupManagerPlus -- --check
          for features in $CHECK_FEATURES; do
            cargo test --locked --no-default-features --features "$features" --all-targets -- --test-threads=1
            cargo clippy --locked --no-default-features --features "$features" --all-targets -- -D warnings
          done

  # ==================================================================================
  #  Build & Bundle Jobs
  # ==================================================================================
  build-linux:
    name: Build for Linux
    runs-on: ${{ matrix.runner }}
    container:
      image: ubuntu:20.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            arch: x86_64
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-22.04-arm
            arch: aarch64
            target: aarch64-unknown-linux-gnu
          - runner: ubuntu-22.04
            arch: i686
            target: i686-unknown-linux-gnu

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y curl lsb-release software-properties-common gnupg python3 desktop-file-utils

      - name: Install i686 dependencies
        if: matrix.arch == 'i686'
        run: apt-get install -y libc6-dev-i386

      - name: Install LLVM
        run: |
          curl -LO https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          ./llvm.sh 23

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.99
        with:
          components: rust-src

      - name: Download appimagetool
        run: |
          curl -LO "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-${{ matrix.arch }}.AppImage"
          chmod +x appimagetool-${{ matrix.arch }}.AppImage

      - name: Build binary
        run: |
          cargo build --locked -Z build-std=std,panic_abort --release --target ${{ matrix.target }} --no-default-features --features dist-appimage
          cp target/${{ matrix.target }}/release/TinyWiiBackupManagerPlus .
        env:
          RUSTC_BOOTSTRAP: 1
          CC: clang-23
          CXX: clang++-23
          AR: llvm-ar-23
          RANLIB: llvm-ranlib-23
          CFLAGS: -O3 -flto
          CXXFLAGS: -O3 -flto
          RUSTFLAGS: -C linker-plugin-lto -C link-arg=-fuse-ld=lld-23
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER: clang-23
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: clang-23
          CARGO_TARGET_I686_UNKNOWN_LINUX_GNU_LINKER: clang-23

      - name: Verify Linux executable
        run: python3 scripts/verify-release.py binary TinyWiiBackupManagerPlus linux ${{ matrix.arch }}

      - name: Package AppImage
        run: |
          cp -rP package/linux/AppDir TinyWiiBackupManagerPlus.AppDir
          install -Dm0755 TinyWiiBackupManagerPlus TinyWiiBackupManagerPlus.AppDir/usr/bin/TinyWiiBackupManagerPlus
          desktop-file-validate TinyWiiBackupManagerPlus.AppDir/*.desktop
          mkdir -p dist
          cd dist
          export VERSION="$(../scripts/current-version.sh)"
          ../appimagetool-${{ matrix.arch }}.AppImage \
            --comp zstd --mksquashfs-opt -Xcompression-level --mksquashfs-opt 19 \
            -u "gh-releases-zsync|communism420|TinyWiiBackupManagerPlus|latest|*${{ matrix.arch }}.AppImage.zsync" \
            ../TinyWiiBackupManagerPlus.AppDir \
            "TinyWiiBackupManagerPlus-${VERSION_NAME}-linux-${{ matrix.arch }}.AppImage"
          python3 ../scripts/verify-release.py binary "TinyWiiBackupManagerPlus-${VERSION_NAME}-linux-${{ matrix.arch }}.AppImage" linux ${{ matrix.arch }}
        env:
          ARCH: ${{ matrix.arch }}
          APPIMAGE_EXTRACT_AND_RUN: 1

      - name: Upload Linux distributables
        uses: actions/upload-artifact@v7
        with:
          name: dist-linux-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  build-windows:
    name: Build for Windows
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            target: aarch64-pc-windows-msvc
            features: dist-windows-modern
            cflags: /clang:-O3 /clang:-flto /clang:-fuse-ld=lld-link
          - arch: x64
            target: x86_64-win7-windows-msvc
            features: dist-windows-modern
            cflags: /clang:-O3 /clang:-flto /clang:-fuse-ld=lld-link
          - arch: x86
            target: i686-win7-windows-msvc
            features: dist-windows-legacy
            cflags: /clang:-O3

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Install LLVM
        run: |
          Invoke-WebRequest -Uri "https://github.com/llvm/llvm-project/releases/download/llvmorg-23.1.3/LLVM-23.1.3-win64.msi" -OutFile llvm.msi
          Start-Process msiexec.exe -WindowStyle Hidden -Wait -ArgumentList '/i llvm.msi /qn /norestart'
          "C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.99
        with:
          components: rust-src

      - name: Install NASM (for aws-lc-rs)
        if: matrix.features == 'dist-windows-legacy' && matrix.arch != 'x64'
        run: ./scripts/install-nasm.ps1

      - name: Download and extract VC-LTL5
        run: |
          Invoke-WebRequest -Uri "https://github.com/Chuyu-Team/VC-LTL5/releases/download/v5.3.1/VC-LTL-Binary.7z" -OutFile "VC-LTL-Binary.7z"
          7z x VC-LTL-Binary.7z -oVC-LTL-Binary

      - name: Download and extract YY-Thunks
        if: matrix.arch == 'x64' || matrix.arch == 'x86'
        run: |
          Invoke-WebRequest -Uri "https://github.com/Chuyu-Team/YY-Thunks/releases/download/v1.2.3/YY-Thunks-Objs.zip" -OutFile "YY-Thunks-Objs.zip"
          7z x YY-Thunks-Objs.zip -oYY-Thunks-Objs

      - name: Build binary
        run: |
          cargo build --locked -Z build-std=std,panic_abort --release --target ${{ matrix.target }} --no-default-features --features ${{ matrix.features }}
          if ($LASTEXITCODE -ne 0) { throw "Cargo build failed with exit code $LASTEXITCODE." }
          Copy-Item -Path "target\${{ matrix.target }}\release\TinyWiiBackupManagerPlus.exe" -Destination .
        env:
          RUSTC_BOOTSTRAP: 1
          CC: clang-cl
          CXX: clang-cl
          AR: llvm-lib
          CFLAGS: ${{ matrix.cflags }}
          CXXFLAGS: ${{ matrix.cflags }}
          CARGO_TARGET_X86_64_WIN7_WINDOWS_MSVC_RUSTFLAGS: -C target-feature=+crt-static -C linker-plugin-lto -L native=${{ github.workspace }}\VC-LTL-Binary\TargetPlatform\6.0.6000.0\lib\x64 -C link-arg=${{ github.workspace }}\YY-Thunks-Objs\objs\x64\YY_Thunks_for_Vista.obj -l dylib=ole32 -C link-arg=/FORCE:MULTIPLE -C link-arg=/SUBSYSTEM:WINDOWS,6.0
          CARGO_TARGET_I686_WIN7_WINDOWS_MSVC_RUSTFLAGS: -C target-feature=+crt-static -L native=${{ github.workspace }}\VC-LTL-Binary\TargetPlatform\5.1.2600.0\lib\Win32 -C link-arg=${{ github.workspace }}\YY-Thunks-Objs\objs\x86\YY_Thunks_for_WinXP.obj -l dylib=ole32 -C link-arg=/SUBSYSTEM:WINDOWS,5.1
          CARGO_TARGET_AARCH64_PC_WINDOWS_MSVC_RUSTFLAGS: -C target-feature=+crt-static -C linker-plugin-lto -L native=${{ github.workspace }}\VC-LTL-Binary\TargetPlatform\10.0.10240.0\lib\ARM64
          CARGO_TARGET_X86_64_WIN7_WINDOWS_MSVC_LINKER: lld-link
          CARGO_TARGET_AARCH64_PC_WINDOWS_MSVC_LINKER: lld-link

      - name: Verify Windows executable
        run: python scripts/verify-release.py binary TinyWiiBackupManagerPlus.exe windows ${{ matrix.arch }}

      - name: Rename binary
        run: |
          New-Item -Path "dist" -ItemType Directory -Force
          Copy-Item "TinyWiiBackupManagerPlus.exe" "dist\TinyWiiBackupManagerPlus-$($env:VERSION_NAME)-windows-${{ matrix.arch }}.exe"

      - name: Upload Windows distributables
        uses: actions/upload-artifact@v7
        with:
          name: dist-windows-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  build-macos:
    name: Build for macOS
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            target: aarch64-apple-darwin
            deployment_target: 11
          - arch: x86_64
            target: x86_64-apple-darwin
            deployment_target: 10.12

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Install LLVM and LLD
        run: brew install llvm@23 lld@23

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.99
        with:
          components: rust-src

      - name: Build binary
        run: |
          cargo build --locked -Z build-std=std,panic_abort --release --target ${{ matrix.target }} --no-default-features --features dist-macos
          cp target/${{ matrix.target }}/release/TinyWiiBackupManagerPlus .
        env:
          RUSTC_BOOTSTRAP: 1
          CC: /opt/homebrew/opt/llvm@23/bin/clang
          CXX: /opt/homebrew/opt/llvm@23/bin/clang++
          AR: /opt/homebrew/opt/llvm@23/bin/llvm-ar
          CFLAGS: -O3 -flto -mmacosx-version-min=${{ matrix.deployment_target }}
          CXXFLAGS: -O3 -flto -mmacosx-version-min=${{ matrix.deployment_target }}
          RUSTFLAGS: -C linker-plugin-lto -C link-arg=-fuse-ld=/opt/homebrew/opt/lld@23/bin/ld64.lld
          MACOSX_DEPLOYMENT_TARGET: ${{ matrix.deployment_target }}
          CARGO_TARGET_AARCH64_APPLE_DARWIN_LINKER: ./macos-linker.sh
          CARGO_TARGET_X86_64_APPLE_DARWIN_LINKER: ./macos-linker.sh

      - name: Verify macOS architecture
        run: lipo TinyWiiBackupManagerPlus -verify_arch ${{ matrix.arch }}

      - name: Upload macOS binaries
        uses: actions/upload-artifact@v7
        with:
          name: build-macos-${{ matrix.arch }}
          path: TinyWiiBackupManagerPlus
          if-no-files-found: error

  build-macos-universal:
    name: Build for macOS (Universal)
    runs-on: macos-latest
    needs: [build-macos]

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Download macOS binaries
        uses: actions/download-artifact@v8
        with:
          pattern: "build-macos-*"

      - name: Create the .app bundle
        run: |
          cp -r package/macos/App TinyWiiBackupManagerPlus.app
          mkdir -p TinyWiiBackupManagerPlus.app/Contents/MacOS
          VERSION="$(./scripts/current-version.sh)"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $VERSION" TinyWiiBackupManagerPlus.app/Contents/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $VERSION" TinyWiiBackupManagerPlus.app/Contents/Info.plist

      - name: Build the fat binary
        run: |
          lipo -create \
            -output TinyWiiBackupManagerPlus.app/Contents/MacOS/TinyWiiBackupManagerPlus \
            build-macos-arm64/TinyWiiBackupManagerPlus \
            build-macos-x86_64/TinyWiiBackupManagerPlus
          chmod 755 TinyWiiBackupManagerPlus.app/Contents/MacOS/TinyWiiBackupManagerPlus
          lipo TinyWiiBackupManagerPlus.app/Contents/MacOS/TinyWiiBackupManagerPlus -verify_arch arm64 x86_64
          plutil -lint TinyWiiBackupManagerPlus.app/Contents/Info.plist

      - name: Sign the .app bundle
        run: |
          codesign --force --deep -s - TinyWiiBackupManagerPlus.app
          codesign --verify --deep --strict TinyWiiBackupManagerPlus.app

      - name: Install appdmg
        run: npm i -g appdmg

      - name: Create Universal DMG
        run: |
          mkdir dist
          appdmg package/macos/appdmg.json "dist/TinyWiiBackupManagerPlus-${VERSION_NAME}-macos-universal.dmg"
          hdiutil verify "dist/TinyWiiBackupManagerPlus-${VERSION_NAME}-macos-universal.dmg"

      - name: Upload macOS distributables
        uses: actions/upload-artifact@v7
        with:
          name: dist-macos-universal
          path: dist/*
          if-no-files-found: error

  # ==================================================================================
  #  Release Job: Collects checked artifacts into a draft for final verification.
  # ==================================================================================
  release:
    name: Create draft GitHub Release
    if: github.ref_type == 'tag' || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    runs-on: ubuntu-24.04
    needs: [validate, build-linux, build-windows, build-macos, build-macos-universal]
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Download distributables
        uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: "dist-*" # This pattern will match all final distributable artifacts
          merge-multiple: true # This places all matching artifacts into a single 'dist' directory

      - name: Check asset set and create checksums
        env:
          RELEASE_TAG: ${{ env.VERSION_NAME }}
        run: |
          ./scripts/current-version.sh > dist/version.txt
          python3 scripts/verify-release.py assets dist \
            --version "$(./scripts/current-version.sh)" --tag "$RELEASE_TAG" --write-checksums
          cd dist
          sha256sum --check SHA256SUMS

      - name: Create draft GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          body_path: package/release-body.md
          draft: true
          tag_name: ${{ env.VERSION_NAME }}
          target_commitish: ${{ github.sha }}
          fail_on_unmatched_files: true
          prerelease: ${{ contains(env.VERSION_NAME, 'alpha') || contains(env.VERSION_NAME, 'beta') || contains(env.VERSION_NAME, 'rc') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
